<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ApplySafe</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <img src="icons/icon48.png" width="22" height="22" alt="" />
        <strong>ApplySafe</strong>
      </div>
      <button id="dash" class="link" type="button">Dashboard</button>
    </header>

    <button id="scan" class="primary" type="button">Scan this page</button>

    <p id="trust" class="note" hidden></p>
    <p id="status" class="note" hidden></p>
    <section id="result" hidden></section>

    <details class="demos">
      <summary>Try an example</summary>
      <div class="row">
        <button class="chip" type="button" data-demo="scam">Crypto task</button>
        <button class="chip" type="button" data-demo="unclear">Thin posting</button>
        <button class="chip" type="button" data-demo="looks_ok">Co-op page</button>
      </div>
    </details>

    <footer>
      <span id="stats-line">0 checked</span>
      <a href="privacy.html" target="_blank" rel="noreferrer">Privacy</a>
    </footer>
    <span hidden><b id="stat-scams">0</b><b id="stat-checked">0</b><b id="stat-safer">100%</b></span>

    <script src="history.js"></script>
    <script src="rules.js"></script>
    <script src="scan.js"></script>
    <script src="brain.js"></script>
    <script src="brain-core.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
